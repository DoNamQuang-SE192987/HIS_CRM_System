spring.application.name=HIS_CRM_System
server.port=8080

# PostgreSQL datasource (override with env vars DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/his_crm}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# CORS - comma separated list of frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Seed the product catalogue on first start (only when the table is empty)
app.seed.enabled=${SEED_ENABLED:true}

# Marketplace order CSV upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Seller info printed on invoices
app.company.name=${COMPANY_NAME:Wholesale Food Management Inc.}
app.company.address=${COMPANY_ADDRESS:880 Industrial Parkway, Suite 200, Hayward, CA 94545}
app.company.phone=${COMPANY_PHONE:(510) 555-0199}
app.company.email=${COMPANY_EMAIL:orders@lnsfood.com}
